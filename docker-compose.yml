services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-syano:latest}
    container_name: syano-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NUXT_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-syano}
      - NUXT_SITE_TOKEN=${NUXT_SITE_TOKEN:-syano_admin_token_change_in_prod}
      - NUXT_SITE_USER=${NUXT_SITE_USER:-root}
      - NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-replace_with_32_char_secret_key_prod}
      - NUXT_REDIRECT_STATUS_CODE=${NUXT_REDIRECT_STATUS_CODE:-301}
      - NUXT_REDIRECT_WITH_QUERY=${NUXT_REDIRECT_WITH_QUERY:-false}
      - NUXT_CASE_SENSITIVE=${NUXT_CASE_SENSITIVE:-false}
      - NUXT_PUBLIC_SLUG_DEFAULT_LENGTH=${NUXT_PUBLIC_SLUG_DEFAULT_LENGTH:-4}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: syano-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_DB=${POSTGRES_DB:-syano}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-syano}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

